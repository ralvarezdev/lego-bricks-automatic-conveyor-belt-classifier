[project]
name = "lego-classifier"
version = "0.1.0"
description = "LEGO Bricks Automatic Conveyor Belt Classifier"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "customtkinter>=5.2.2",
    "datasets>=4.8.4",
    "matplotlib>=3.10.8",
    "onnx>=1.21.0",
    "onnxruntime>=1.24.4",
    "onnxruntime-gpu>=1.24.4",
    "opencv-python>=4.13.0.92",
    "paho-mqtt>=2.1.0",
    "pydantic>=2.13.1",
    "pydantic-settings>=2.13.1",
    "pyserial>=3.5",
    "tensorboard>=2.20.0",
    "torch",
    "torchvision",
    "tqdm>=4.67.3",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
